
<div class="login-page">
  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">F</div>
      <h1>FoldFlow</h1>
      <p>Smart Laundry Management System</p>
    </div>

    <div class="login-heading">
      <h2>Welcome Back</h2>
      <p>Sign in to manage your laundry shop.</p>
    </div>

    <form (ngSubmit)="submitLogin()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email address"
          autocomplete="username"
          required
          email
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="loading || loginForm.invalid"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <div class="login-footer">
      <p>Authorized shop manager access only.</p>
      <p>Need an account? Contact your system administrator.</p>
    </div>

  </div>
</div>
